<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1016"/>
      <stop offset="100%" stop-color="#131c26"/>
    </linearGradient>
  </defs>

  <rect width="960" height="440" rx="12" fill="url(#bg2)" stroke="#2a3642" stroke-width="2"/>

  <text x="36" y="42" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.5">SPATIAL WORKBENCH · A/B GEOMETRY COMPARISON &amp; LINEAGE</text>
  <text x="36" y="68" fill="#f1f5f9" font-size="20" font-weight="700">Comparing Candidate Geometries &amp; Grouping Derived Layer Trees</text>

  <!-- Left Panel: Visual A/B Overlay Diagram -->
  <rect x="36" y="96" width="430" height="308" rx="8" fill="#161f29" stroke="#2a3642" stroke-width="1.5"/>
  <text x="56" y="124" fill="#7dd3fc" font-size="12" font-weight="700">GEOMETRY COMPARISON DECOMPOSITION (CompareTool)</text>

  <!-- Circle A (Only in A) -->
  <circle cx="205" cy="235" r="78" fill="rgba(56, 189, 248, 0.22)" stroke="#38bdf8" stroke-width="2.5"/>
  <!-- Circle B (Only in B) -->
  <circle cx="295" cy="235" r="78" fill="rgba(245, 158, 11, 0.22)" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 4"/>
  <!-- Intersection highlight label -->
  <text x="150" y="232" fill="#7dd3fc" font-size="12" font-weight="700" text-anchor="middle">Only in A</text>
  <text x="150" y="248" fill="#94a3b8" font-size="10" text-anchor="middle">(A − B)</text>
  <text x="250" y="232" fill="#86efac" font-size="12" font-weight="700" text-anchor="middle">Overlap</text>
  <text x="250" y="248" fill="#86efac" font-size="10" text-anchor="middle">(A ∩ B)</text>
  <text x="350" y="232" fill="#fde68a" font-size="12" font-weight="700" text-anchor="middle">Only in B</text>
  <text x="350" y="248" fill="#94a3b8" font-size="10" text-anchor="middle">(B − A)</text>

  <rect x="56" y="334" width="390" height="52" rx="6" fill="#0d131a" stroke="#263340"/>
  <text x="70" y="355" fill="#cbd5e1" font-family="monospace" font-size="11">Metrics: areaA · areaB · intersectionArea · areaDelta</text>
  <text x="70" y="373" fill="#38bdf8" font-family="monospace" font-size="11">jaccardSimilarity = intersectionArea / unionArea</text>

  <!-- Right Panel: Grouped TOC Lineage & Export All -->
  <rect x="494" y="96" width="430" height="308" rx="8" fill="#161f29" stroke="#2a3642" stroke-width="1.5"/>
  <text x="514" y="124" fill="#86efac" font-size="12" font-weight="700">PARENT-CHILD TOC GROUPING &amp; WORKSPACE PERSISTENCE</text>

  <!-- Parent Layer Row -->
  <rect x="514" y="144" width="390" height="42" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="530" y="170" fill="#f1f5f9" font-size="13" font-weight="700">▾ Study Parcels (Polygon · 3) [Imported]</text>
  <text x="855" y="170" fill="#94a3b8" font-size="11">2 derived</text>

  <!-- Child Layer Row 1 -->
  <line x1="534" y1="186" x2="534" y2="272" stroke="#475569" stroke-width="2"/>
  <line x1="534" y1="216" x2="550" y2="216" stroke="#475569" stroke-width="2"/>
  <rect x="550" y="196" width="354" height="38" rx="6" fill="#0d131a" stroke="#2a3642"/>
  <text x="566" y="220" fill="#cbd5e1" font-size="12" font-weight="600">Buffer of Study Parcels (500 m) [Derived]</text>

  <!-- Child Layer Row 2 -->
  <line x1="534" y1="264" x2="550" y2="264" stroke="#475569" stroke-width="2"/>
  <rect x="550" y="244" width="354" height="38" rx="6" fill="#0d131a" stroke="#2a3642"/>
  <text x="566" y="268" fill="#cbd5e1" font-size="12" font-weight="600">Comparison of Study Parcels vs AI Candidate [Derived]</text>

  <!-- Export All & Settings Summary -->
  <rect x="514" y="302" width="390" height="84" rx="6" fill="#0d131a" stroke="#263340"/>
  <text x="530" y="325" fill="#f1f5f9" font-size="12" font-weight="600">Workspace &amp; Export Capabilities</text>
  <text x="530" y="345" fill="#94a3b8" font-size="11">• ExportTool ("All layers"): bundles full workspace + per-layer toolHistory</text>
  <text x="530" y="363" fill="#94a3b8" font-size="11">• Consolidated Settings: persists AI provider, startup map view &amp; format</text>
  <text x="530" y="380" fill="#94a3b8" font-size="11">• Draw Clear All: removes manual sketches and derived tool result groups</text>
</svg>
